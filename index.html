<style>
/* Layout: navy office header + light date strip, white working area, tinted alert rows, cards stack to one column on phones.
   Deliberately light-only: plain white, like a bank statement or a government form HK firms already trust. */
:root{
  color-scheme:light;
  --bg:#ffffff;
  --surface:#ffffff;
  --surface-2:#f4f6f9;
  --ink:#14212e;
  --muted:#5b6775;
  --line:#e1e6ec;
  --brand:#0f2a4a;        /* header navy */
  --on-brand:#ffffff;
  --accent:#0b5cad;       /* action blue */
  --accent-soft:#e8f1fb;
  --focus:#5aa0ff;
  --red:#c62828; --red-soft:#fdeeee;
  --amber:#b45309; --amber-soft:#fff5e6;
  --green:#1e7a46; --green-soft:#e8f5ee;
  --paper:#ffffff;
  --on-strong:#ffffff;
  --chop:#4a3f9b;         /* signature-chop ink */
  --sig:#1b2d74;
  --font-body:"Noto Sans TC",-apple-system,"PingFang HK","Microsoft JhengHei",sans-serif;
  --font-num:"Noto Sans TC",-apple-system,"PingFang HK","Microsoft JhengHei",sans-serif;
  --radius:12px;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.6;margin:0}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);box-shadow:0 1px 0 var(--line)}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px}
.brandbar{background:var(--brand);color:var(--on-brand)}
.bar{display:flex;align-items:center;gap:12px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;flex-wrap:wrap}
.brand b{font-weight:900;font-size:23px;letter-spacing:.04em;color:var(--on-brand)}
.brand span{color:var(--on-brand);opacity:.75;font-size:13px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.pill.demo{background:rgba(255,255,255,.1);color:var(--on-brand);border:1px solid rgba(255,255,255,.35);font-weight:500}
.lang{border:1px solid rgba(255,255,255,.4);background:transparent;color:var(--on-brand);border-radius:6px;padding:2px 8px;font-size:12px;font-weight:500;line-height:1.5}
.datestrip{background:var(--surface-2);border-bottom:1px solid var(--line)}
.datebar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-block:8px;font-size:14px;color:var(--muted)}
.datebar .d{color:var(--ink);font-weight:700}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-strong)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:none;color:var(--muted);padding:12px 14px;font-weight:700;font-size:16px;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
nav.tabs .cnt{display:inline-block;min-width:20px;margin-left:5px;padding:0 6px;border-radius:999px;background:var(--red);color:var(--on-strong);font-size:12px;line-height:20px;text-align:center}

main{padding-block:24px 48px}
h1{font-size:26px;font-weight:900;margin:0 0 4px;text-wrap:balance}
h2{font-size:17px;font-weight:700;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 20px;max-width:65ch}
.section{display:grid;gap:12px;margin-bottom:28px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:28px}
@media (max-width:760px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--surface-2);border-radius:var(--radius);padding:14px 16px;min-width:0}
.stat .k{font-size:13px;color:var(--muted)}
.stat .v{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-size:22px;font-weight:700;margin-top:2px;overflow-wrap:anywhere}
.stat.warn{background:var(--red-soft)}
.stat.warn .v{color:var(--red)}

.alert{display:grid;grid-template-columns:6px 1fr auto;gap:0 14px;background:var(--accent-soft);border-radius:var(--radius);overflow:hidden}
.alert .stripe{background:var(--accent)}
.alert.red{background:var(--red-soft)} .alert.red .stripe{background:var(--red)}
.alert.amber{background:var(--amber-soft)} .alert.amber .stripe{background:var(--amber)}
.alert .body{padding:14px 0;min-width:0}
.alert .t{font-weight:700}
.alert.red .t{color:var(--red)}
.alert .dd{color:var(--ink);opacity:.85;font-size:15px;margin-top:2px}
.alert .act{display:flex;align-items:center;padding:14px 16px 14px 0}
@media (max-width:600px){.alert{grid-template-columns:6px 1fr}.alert .act{grid-column:2;padding:0 16px 14px 0}}

.btn{border:1px solid var(--accent);background:var(--accent);color:var(--on-strong);border-radius:8px;padding:8px 14px;font-weight:700;font-size:15px;white-space:nowrap}
.btn.ghost{background:var(--surface);color:var(--accent)}
.btn.small{padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;display:grid;gap:10px;min-width:0}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.row > div{min-width:0}
.meta{color:var(--muted);font-size:14px}
.amt{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-weight:700;font-size:19px;white-space:nowrap}
.status{display:inline-block;font-size:13px;font-weight:700;padding:2px 10px;border-radius:999px;white-space:nowrap;margin-top:2px}
.s-red{background:var(--red-soft);color:var(--red)} .s-amber{background:var(--amber-soft);color:var(--amber)}
.s-green{background:var(--green-soft);color:var(--green)} .s-blue{background:var(--accent-soft);color:var(--accent)}
.s-grey{background:var(--surface-2);color:var(--muted)}

/* 0 → 30 → 60 day clock */
.clock{position:relative;height:32px;margin-top:4px}
.clock .track{position:absolute;left:0;right:0;top:9px;height:8px;border-radius:4px;background:var(--surface-2)}
.clock .fill{position:absolute;left:0;top:9px;height:8px;border-radius:4px;background:var(--accent)}
.clock.late .fill{background:var(--red)}
.clock .tick{position:absolute;top:5px;width:2px;height:16px;background:var(--line)}
.clock .lab{position:absolute;top:24px;font-size:12px;color:var(--muted);transform:translateX(-50%);white-space:nowrap}
.clock .lab.l{transform:none} .clock .lab.r{transform:translateX(-100%)}
.clock .now{position:absolute;top:1px;width:14px;height:14px;border-radius:50%;background:var(--surface);transform:translateX(-50%);border:3px solid var(--ink)}
.clockwrap{padding-bottom:12px}

.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}

.formcard{background:var(--surface-2);border-radius:var(--radius);padding:18px;display:grid;gap:12px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
label.f{display:grid;gap:4px;font-size:14px;color:var(--muted);min-width:0}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%;min-width:0}
textarea{min-height:80px;resize:vertical}
.calc{display:grid;grid-template-columns:1fr auto;gap:4px 16px;font-size:15px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.calc .num{text-align:right}
.calc .tot{font-weight:700;border-top:1px solid var(--line);padding-top:6px}

.check{display:grid;gap:12px}
.q{display:grid;gap:6px}
.q .opts{display:flex;gap:6px;flex-wrap:wrap}
.result{border-radius:8px;padding:10px 12px;font-weight:700}

.retsum{display:flex;gap:20px;flex-wrap:wrap;font-size:15px;color:var(--muted)}
.retsum b{color:var(--ink);font-variant-numeric:tabular-nums}

footer{color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-block:16px 32px;line-height:1.7}

/* document modal */
.overlay{position:fixed;inset:0;background:rgba(15,42,74,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:24px 12px calc(24px + env(safe-area-inset-bottom,0px))}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:720px;display:grid;gap:12px;padding:18px;margin-top:env(safe-area-inset-top,0px)}
.modal .mh{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.paper{background:var(--paper);border:1px solid var(--line);border-top:4px solid var(--brand);border-radius:6px;padding:20px;font-size:15px;line-height:1.75;overflow-x:auto}
.paper h3{margin:0;font-size:18px;font-weight:900;text-align:center;color:var(--brand)}
.paper .c{text-align:center;color:var(--muted);font-size:13px;margin-bottom:12px}
.paper table{border-collapse:collapse;width:100%;min-width:420px;margin:6px 0}
.paper td{padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.paper td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.paper tr.tot td{font-weight:700;border-top:2px solid var(--ink);border-bottom:0}
.paper .lbl{color:var(--muted)}
.paper .warn{margin-top:14px;font-size:12.5px;color:var(--amber)}
.sig{display:inline-block;vertical-align:middle}
.stamp{display:inline-flex;flex-direction:column;align-items:center;gap:1px;border:2px solid var(--chop);color:var(--chop);padding:6px 12px 4px;text-align:center;font-size:11px;line-height:1.35;transform:rotate(-2deg);margin:6px 0 2px;background:transparent}
.stamp .st-n{font-weight:700;font-size:12px}
.stamp svg{display:block;width:120px;height:34px;margin:2px 0}
.stamp .st-a{border-top:1px dotted var(--chop);padding-top:1px;font-size:10px;min-width:150px}
.stamp-img{display:inline-block;margin:6px 0 2px}
.stamp-img img{display:block;max-width:210px;max-height:120px;transform:rotate(-1.5deg)}
.chopbox{background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:16px;display:flex;align-items:center;justify-content:center;min-height:140px}
.urow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.urow:last-child{border-bottom:0}
.tog{display:flex;align-items:center;gap:8px;font-size:15px;cursor:pointer}
.tog input{width:auto}
.logrow{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.btn.armed{background:var(--amber);border-color:var(--amber)}
.evlist{display:grid;gap:8px}
.evrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;min-width:0}
.evrow .ic{flex:none;width:34px;height:34px;border-radius:6px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--muted)}
.evrow img{flex:none;width:34px;height:34px;object-fit:cover;border-radius:6px}
.evrow .nm{overflow-wrap:anywhere;font-size:14px}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius)}
table.vo{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
table.vo th,table.vo td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.vo th{background:var(--surface-2);font-weight:700;color:var(--muted);font-size:13px}
table.vo td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.vo select{width:auto;padding:4px 8px;font-size:14px}
.dedrow{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1.4fr) auto;gap:8px;align-items:end}
@media (max-width:600px){.dedrow{grid-template-columns:1fr 1fr}}
.xbtn{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;padding:8px 10px}
.phone{max-width:420px;margin:0 auto;border-radius:22px;overflow:hidden;border:1px solid var(--line);box-shadow:0 6px 24px rgba(15,42,74,.12);background:#efeae2}
.phone .ph-head{background:var(--brand);color:var(--on-brand);padding:12px 16px;display:flex;align-items:center;gap:10px}
.phone .ph-av{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-weight:900}
.phone .ph-name{font-weight:700;line-height:1.2}.phone .ph-st{font-size:12px;opacity:.75}
.chat{padding:14px 12px;display:flex;flex-direction:column;gap:8px;min-height:380px;max-height:520px;overflow-y:auto}
.bub{max-width:82%;padding:8px 10px 6px;border-radius:10px;font-size:15px;line-height:1.5;white-space:pre-line;box-shadow:0 1px 1px rgba(0,0,0,.08);color:#111b21}
.bub.in{align-self:flex-start;background:#ffffff;border-top-left-radius:2px}
.bub.out{align-self:flex-end;background:#d9fdd3;border-top-right-radius:2px}
.bub .tm{display:block;text-align:right;font-size:11px;color:#667781;margin-top:2px}
.bub .att{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.05);border-radius:8px;padding:8px;margin-bottom:6px;font-size:13px}
.bub .att b{display:inline-flex;width:32px;height:32px;border-radius:6px;background:#fff;align-items:center;justify-content:center;font-size:11px;color:#667781}
.bub .bbtn{display:block;width:100%;margin-top:6px;border:0;border-top:1px solid #e9edef;background:none;color:#027eb5;font-weight:700;padding:8px 0 2px;font-size:14px}
.skip{align-self:center;background:#fff3c4;color:#54656f;font-size:12px;padding:4px 10px;border-radius:8px}
.ph-foot{display:flex;gap:8px;padding:10px 12px;background:#f0f2f5;justify-content:center;flex-wrap:wrap}
.todaycard{border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:grid;gap:12px;margin-bottom:24px}
.todaycard h2{font-size:20px}
details.more summary{cursor:pointer;color:var(--accent);font-weight:700;padding:6px 0}
details.more[open] summary{margin-bottom:10px}
.mail{max-width:560px;margin:0 auto;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--surface)}
.mail .mh2{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:12px 14px;border-bottom:1px solid var(--line);font-size:14px}
.mail .mh2 span:nth-child(odd){color:var(--muted)}
.mail .mb{padding:12px 14px;font-size:15px;white-space:pre-line}
.mail .mf{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mail .apb{background:var(--surface-2);color:var(--muted);font-size:12px;font-weight:700;padding:6px 14px;border-bottom:1px solid var(--line)}
.mail .ok{background:var(--green-soft);color:var(--green);padding:10px 14px;font-weight:700;border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--brand);color:var(--on-brand);padding:9px 18px;border-radius:8px;font-size:15px;z-index:60}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}.card:hover{border-color:var(--muted)}}
</style>

</head>
<body>
<header class="top">
  <div class="brandbar"><div class="wrap">
    <div class="bar">
      <div class="brand"><b data-t="brand"></b><span data-t="company"></span></div>
      <span class="pill demo" data-t="demoPill"></span>
      <button class="lang" id="langBtn" type="button" aria-label="Switch language"></button>
    </div>
  </div></div>
  <div class="datestrip"><div class="wrap">
    <div class="datebar">
      <span data-t="demoDate"></span><span class="d num" id="demoDate"></span>
      <button class="chip" type="button" data-shift="0"></button>
      <button class="chip" type="button" data-shift="7"></button>
      <button class="chip" type="button" data-shift="30"></button>
      <span data-t="dateHint"></span>
    </div>
  </div></div>
  <div class="wrap"><nav class="tabs" role="tablist" id="tabs"></nav></div>
</header>

<main class="wrap" id="main"></main>
<footer class="wrap" id="foot"></footer>
<div id="modalRoot"></div>

<script>
(function(){
"use strict";
/* ---------- dates ---------- */
const BASE = "2026-10-12";
const D = s => { const [y,m,d] = s.split("-").map(Number); return Date.UTC(y,m-1,d); };
const iso = t => new Date(t).toISOString().slice(0,10);
const add = (s,n) => iso(D(s) + n*864e5);
const diff = (a,b) => Math.round((D(b)-D(a))/864e5); // b - a in days
const addYears = (s,n) => { const [y,m,d]=s.split("-"); return `${+y+n}-${m}-${d}`; };

/* ---------- state ---------- */
const S = { lang:"zh", shift:0, tab:"overview" };
try { const l = localStorage.getItem("ontime-lang"); if (l==="en"||l==="zh") S.lang=l; } catch(e){}
const today = () => add(BASE, S.shift);

/* ---------- strings ---------- */
const T = {
zh:{
 brand:"準時收", company:"陳氏電器工程有限公司（虛構）", demoPill:"示範 · 虛構資料",
 demoDate:"示範日期", dateHint:"撳「+7 日」「+30 日」睇吓期限到咗會點", today:"今日", p7:"+7 日", p30:"+30 日",
 t_overview:"總覽", t_out:"發出申索", t_in:"收到申索", t_ret:"保留金", t_jobs:"工程",
 ov_h:"今日要處理", ov_sub:"系統按每份合約嘅條款自動計住回覆同付款限期（條例上限：回覆 30 日、付款 60 日），同每筆保留金幾時應該發還。",
 st_unpaid:"已申索未收", st_ret:"被扣起嘅保留金", st_retOver:"逾期未還保留金", st_dl:"14 日內嘅期限",
 nothing:"暫時冇嘢要處理。",
 out_h:"發出嘅付款申索", out_sub:"每月申索 → 合約訂明嘅回覆期（最長 30 日）：對方要回覆 → 付款期（最長 60 日）：要付款。逾期即刻提你。",
 in_h:"收到嘅付款申索（你嘅判頭）", in_sub:"你嘅判頭向你申索，你都要喺合約訂明期限內（最長 30 日）書面回覆，每項扣數都要寫明理由。",
 ret_h:"保留金記錄（所有工程）", ret_sub:"包括唔受條例保障嘅舊工程。到期提你，臨近追討時限再提你。信由你自己簽名寄出。",
 jobs_h:"工程", jobs_sub:"邊啲工程受《建造業付款保障條例》保障，一眼睇晒。",
 newClaim:"新增本月申索", job:"工程", period:"申索期間", cum:"累計完成合約工程 (HK$)", vari:"更改工程 (HK$)", prev:"減：之前已付 (HK$)",

/* ---------- status logic ---------- */
function outStatus(c){
  const now = today(), respDue = add(c.served,rd(c.job)), payDue = add(c.served,pd(c.job));
  const a = calc(c).amt, sinceServe = diff(c.served, now);
  if (c.paid && diff(c.paid, now) >= 0) return { key:"paid", cls:"s-green", label:t("stPaid"), respDue, payDue, sinceServe, a };
  // A response that arrives after the response deadline is treated like no response.
  const lateResp = c.resp && diff(c.resp.date, now) >= 0 && diff(respDue, c.resp.date) > 0;
  if (!c.resp || diff(c.resp.date, now) < 0 || lateResp){
    if (diff(respDue, now) > 0) return { key:"noresp", cls:"s-red", label:t(lateResp ? "stLateResp" : "stNoResp"), respDue, payDue, sinceServe, a, lateResp, adjBy:add(respDue,28) };
    return { key:"waitresp", cls:"s-blue", label:t("stWaitResp"), respDue, payDue, sinceServe, a };
  }
  const cut = a - c.resp.admitted;
  if (diff(payDue, now) > 0) return { key:"paylate", cls:"s-red", label:t("stPayLate"), respDue, payDue, sinceServe, a, cut };
  return { key:"waitpay", cls: cut>0 ? "s-amber":"s-blue", label: cut>0 ? t("stCut",{a:money(cut)}) : t("stWaitPay"), respDue, payDue, sinceServe, a, cut, adjBy: cut>0 ? add(c.resp.date,28) : null };
}
function inStatus(c){
  const now = today(), due = add(c.served,rd(c.job));
  if (c.resp && diff(due, c.resp.date) > 0) return { key:"lateDone", cls:"s-red", label:t("inRespLate"), due };
  if (c.resp) return { key:"done", cls:"s-green", label:t("inDone"), due };
  const n = diff(now, due);
  if (n < 0) return { key:"late", cls:"s-red", label:t("inLate"), due, n };
  return { key:"open", cls: n<=10 ? "s-amber":"s-blue", label: left(n), due, n };
}
function retStatus(r){
  const now = today(), limit = addYears(r.due,6);
  if (r.paid) return { key:"paid", cls:"s-green", label:t("retPaid"), limit };
  const over = diff(r.due, now), toLimit = diff(now, limit);
  if (over < 0) return { key: over > -31 ? "soon":"notdue", cls: over > -31 ? "s-blue":"s-grey", label: over > -31 ? t("retSoon") : t("retNotDue"), limit, over, toLimit };
  if (toLimit <= 180) return { key:"near", cls:"s-red", label:t("retNear"), limit, over, toLimit };
  return { key:"over", cls:"s-amber", label:t("retOver",{n:Math.max(1,Math.floor(over/30.44))}), limit, over, toLimit };
}

function buildAlerts(){
  const now = today(), A = [];
  claimsOut.forEach((c,i) => {
    const s = outStatus(c), j = J(c.job), b = L(j.builder);
    if (s.key==="noresp" && diff(now, s.adjBy) >= -60)
      A.push({ sev:0, d:diff(now,s.adjBy), t:t(s.lateResp ? "a_lateResp" : "a_noResp",{b,no:c.no}), dd:t("a_noRespD",{amt:money(s.a), d:fmt(s.adjBy), left:left(diff(now,s.adjBy))}), act:{lab:t("adjPack"), fn:()=>docAdj(i)} });
    if (s.key==="waitresp" && diff(now,s.respDue) <= 7)
      A.push({ sev:2, d:diff(now,s.respDue), t:t("a_respSoon",{no:c.no, d:fmt(s.respDue)}), dd:t("a_respSoonD",{b, amt:money(s.a), left:left(diff(now,s.respDue))}), act:{lab:t("viewDoc"), fn:()=>docClaim(i)} });
    if (s.key==="waitpay" && s.cut>0 && diff(now,s.adjBy) >= 0)
      A.push({ sev:1, d:diff(now,s.adjBy), t:t("a_cut",{no:c.no, amt:money(s.cut)}), dd:t("a_cutD",{r:L(c.resp.reason)||"—", d:fmt(s.adjBy), left:left(diff(now,s.adjBy))}), act:{lab:t("adjPack"), fn:()=>docAdj(i)} });
    if (s.key==="waitpay" && diff(now,s.payDue) <= 21)
      A.push({ sev:2, d:diff(now,s.payDue), t:t("a_paySoon",{amt:money(c.resp.admitted), d:fmt(s.payDue)}), dd:t("a_paySoonD",{b,no:c.no,left:left(diff(now,s.payDue))}), act:null });
    if (s.key==="paylate")
      A.push({ sev:0, d:-diff(s.payDue,now), t:t("a_payLate",{b, amt:money(c.resp.admitted)}), dd:t("a_payLateD",{no:c.no}), act:{lab:t("adjPack"), fn:()=>docAdj(i)} });
  });
  claimsIn.forEach((c,i) => {
    const s = inStatus(c), f = L(c.from);
    if (s.key==="lateDone") A.push({ sev:1, d:0, t:t("a_inRespLate",{f,no:c.no}), dd:t("a_inLateD",{amt:money(c.amt)}), act:{lab:t("viewResp"), fn:()=>docResp(i)} });
    else if (s.key==="late") A.push({ sev:0, d:s.n, t:t("a_inLate",{f,no:c.no}), dd:t("a_inLateD",{amt:money(c.amt)}), act:{lab:t("replyBtn"), fn:()=>respForm(i)} });
    else if (s.key==="open" && s.n<=10) A.push({ sev:1, d:s.n, t:t("a_inSoon",{f,no:c.no,n:s.n}), dd:t("a_inSoonD",{amt:money(c.amt)}), act:{lab:t("replyBtn"), fn:()=>respForm(i)} });
  });
  const others = [];
  retention.forEach((r,i) => {
    const s = retStatus(r);
    if (s.key==="near") A.push({ sev:0, d:s.toLimit, t:t("a_limit",{j:L(J(r.job).name), amt:money(r.amt), n:s.toLimit}), dd:t("a_limitD",{d:fmt(r.due)}), act:{lab:t("letterBtn"), fn:()=>docLetter(i)} });
    else if (s.key==="over") others.push(r);
  });
  if (others.length) A.push({ sev:1, d:999, t:t("a_retMore",{n:others.length, amt:money(others.reduce((x,r)=>x+r.amt,0))}), dd:t("a_retMoreD"), act:{lab:t("goRet"), fn:()=>go("ret")} });
  return A.sort((a,b)=> a.sev-b.sev || a.d-b.d);
}

function clockHTML(c, s){
  const R = rd(c.job), P = pd(c.job);
  const pct = x => Math.max(0, Math.min(100, x/P*100));
  const now = Math.max(0, Math.min(P, s.sinceServe));
  const late = s.key==="noresp" || s.key==="paylate";
  return `<div class="clockwrap"><div class="clock ${late?"late":""}" aria-hidden="true">
    <div class="track"></div><div class="fill" style="width:${pct(now)}%"></div>
    <div class="tick" style="left:0"></div><div class="tick" style="left:${pct(R)}%"></div><div class="tick" style="left:calc(100% - 2px)"></div>
    ${s.key!=="paid" ? `<div class="now" style="left:${pct(now)}%"></div>` : ""}
    <div class="lab l" style="left:0">${esc(t("day",{n:0}))}</div>
    <div class="lab" style="left:${pct(R)}%">${esc(t("day",{n:R}))} · ${esc(t("clkResp"))}</div>
    <div class="lab r" style="left:100%">${esc(t("day",{n:P}))} · ${esc(t("clkPay"))}</div>
  </div></div>`;
}

function drawChat(){
  const box = document.getElementById("chat"); if (!box) return;
  box.innerHTML = "";
  const hi = document.createElement("div"); hi.className = "bub in";
  WA.t0 = WA.t0 || waTime();
  hi.innerHTML = esc(t("wa_hi")) + `<span class="tm">${WA.t0}</span>`; box.appendChild(hi);
  if (!WA.msgs.length){ const h = document.createElement("div"); h.className = "skip"; h.textContent = t("wa_hint"); box.appendChild(h); }
  WA.msgs.forEach(m => {
    if (m.skip){ const d = document.createElement("div"); d.className = "skip"; d.textContent = m.text(); box.appendChild(d); return; }
    const b = document.createElement("div"); b.className = "bub " + m.side;
    b.innerHTML = (m.att ? `<div class="att"><b>${m.att.kind==="img"?"IMG":"PDF"}</b><span>${esc(m.att.name)}</span></div>` : "") + esc(m.text()) + `<span class="tm">${m.tm}</span>`;

function processChop(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => { try {
      const sc = Math.min(1, 900 / Math.max(img.width, img.height)), w = Math.round(img.width*sc), h = Math.round(img.height*sc);
      const c = document.createElement("canvas"); c.width = w; c.height = h;
      const g = c.getContext("2d"); g.drawImage(img, 0, 0, w, h);
      const d = g.getImageData(0, 0, w, h), px = d.data; let x0 = w, y0 = h, x1 = -1, y1 = -1;
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++){
        const i = (y*w + x)*4, lum = 0.299*px[i] + 0.587*px[i+1] + 0.114*px[i+2];
        if (lum > 185) px[i+3] = 0;
        else { if (lum > 140) px[i+3] = Math.round(255*(185-lum)/45); if (x<x0) x0=x; if (x>x1) x1=x; if (y<y0) y0=y; if (y>y1) y1=y; }
      }
      if (x1 < 0) throw new Error("empty");
      g.putImageData(d, 0, 0);
      x0 = Math.max(0, x0-6); y0 = Math.max(0, y0-6); x1 = Math.min(w-1, x1+6); y1 = Math.min(h-1, y1+6);
      const o = document.createElement("canvas"); o.width = x1-x0+1; o.height = y1-y0+1;
      o.getContext("2d").drawImage(c, x0, y0, o.width, o.height, 0, 0, o.width, o.height);
      URL.revokeObjectURL(url); res(o.toDataURL("image/png"));
    } catch(e){ URL.revokeObjectURL(url); rej(e); } };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("img")); };
    img.src = url;
  });
}

let dlP = null;
function getDL(){
  if (!dlP) dlP = Promise.resolve({ save: async ({ filename, data }) => {
    const blob = data instanceof Blob ? data : new Blob([data], { type: "application/pdf" });
    const u = URL.createObjectURL(blob), a = document.createElement("a");
    a.href = u; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(u), 4000);
    return { status: "saved" };
  }});
  return dlP;
}
const LIBS = {
  h2c:"https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js",
  jspdf:"https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js",
};
const loading = {};
function loadScript(u){
  if (!loading[u]) loading[u] = new Promise((res, rej) => { const sc=document.createElement("script"); sc.src=u; sc.onload=res; sc.onerror=()=>{ delete loading[u]; rej(new Error("load")); }; document.head.appendChild(sc); });
  return loading[u];
}
async function withBusy(btn, work){
  const old = btn.textContent; btn.disabled = true; btn.textContent = t("preparing");
  try { await work(); toast(t("saved")); }
  catch(e){ if (!(e && e.code === "declined")) toast(t("dlFail")); }
  finally { btn.disabled = false; btn.textContent = old; }
}
function exportPdf(paper, file, btn){
  return withBusy(btn, async () => {
    const dl = await getDL(); if (!dl) throw new Error("unavailable");
    await Promise.all([loadScript(LIBS.h2c), loadScript(LIBS.jspdf)]);
    const box = document.createElement("div");
    box.style.cssText = "position:fixed;left:-10000px;top:0;width:760px;background:#ffffff";
    const clone = paper.cloneNode(true); clone.style.overflow = "visible"; clone.style.borderRadius = "0";
    box.appendChild(clone); document.body.appendChild(box);
    try { if (document.fonts && document.fonts.ready) await document.fonts.ready;
      var canvas = await window.html2canvas(clone, { scale:2, backgroundColor:"#ffffff" }); }
    finally { box.remove(); }
    const pdf = new window.jspdf.jsPDF({ unit:"mm", format:"a4" });
    const m = 12, w = 210 - 2*m, pxPerMm = canvas.width / w, pageH = Math.floor((297 - 2*m) * pxPerMm);
    for (let y = 0, pg = 0; y < canvas.height; y += pageH, pg++){
      const h = Math.min(pageH, canvas.height - y), c = document.createElement("canvas");
      c.width = canvas.width; c.height = h;
      c.getContext("2d").drawImage(canvas, 0, y, canvas.width, h, 0, 0, canvas.width, h);
      if (pg) pdf.addPage();
      pdf.addImage(c.toDataURL("image/jpeg", 0.92), "JPEG", m, m, w, h / pxPerMm);
    }
    await dl.save({ filename: file + ".pdf", data: pdf.output("blob") });
  });
}

    <table>${rows.map(([d,zh,en])=>`<tr><td class="n">${esc(d)}</td><td>${bi(zh,en)}</td></tr>`).join("")}</table>
    <p style="margin-bottom:4px"><b>${bi("2. 爭議金額","2. Amount in dispute")}</b></p>
    <table><tr class="tot"><td>${bi("申索金額減承認金額","Claimed less admitted")}</td><td class="n">${money(disputed)}</td></tr></table>
    <p style="margin-bottom:4px"><b>${bi("3. 要點","3. Key points")}</b></p>
    <ul style="margin:0;padding-left:20px">
      ${c.resp && !s.lateResp ? `<li>${bi(`對方扣減理由：${L(c.resp.reason)||"—"}`,`Payer's reason: ${c.resp.reason?c.resp.reason.en:"—"}`)}</li>` :
        `<li>${bi("對方未有喺限期內送達付款回應：可能唔可以喺審裁中提出抵銷（《條例》第652章，條文須律師確認）","No payment response served in time: payer may not be able to raise set-off in adjudication (Cap. 652; section to be confirmed by a lawyer)")}</li>`}
      <li>${bi(`開展審裁限期（估算）：${adjBy}`,`Start adjudication by (estimate): ${adjBy}`)}</li>
    </ul>
    <p style="margin-bottom:4px"><b>${bi("4. 附件清單","4. Documents attached")}</b></p>
    <ul style="margin:0;padding-left:20px">
      <li>${bi("分判合約","Subcontract")}</li><li>${bi(`付款申索 #${c.no}`,`Payment claim #${c.no}`)}</li>
      ${(c.ev||[]).map(e => `<li>${esc(e.name)}</li>`).join("")}
      ${variations.filter(v=>v.job===c.job && v.st!=="agreed").map(v => `<li>${bi(`更改工程 VO${v.no}：${v.desc.zh}（${v.by.zh}，${v.st==="disputed"?"有爭議":"待確認"}）`,`Variation VO${v.no}: ${v.desc.en} (${v.by.en}, ${v.st})`)}</li>`).join("")}
    </ul>
    <p style="margin-bottom:4px"><b>${bi("5. 下一步","5. Next step")}</b></p>
    <p style="margin-top:0">${bi("轉交合作律師或工料測量師，以定額收費提交審裁通知。","Hand to a partner solicitor or quantity surveyor to file the adjudication notice for a fixed fee.")}</p>
    <div class="warn">${esc(t("draftNote"))}</div></div>`;
  modal(t("doc_adj"), html, null, { file:`審裁資料包-申索第${c.no}號` });
}

function respForm(i){
  const c = claimsIn[i];
  if (!c.ev) c.ev = [];
  let deds = c.resp && c.resp.deds ? c.resp.deds.map(d => ({...d})) :
    [{ reason: S.lang==="zh" ? "第 3 層電線槽未完成" : "3/F cable trays not complete", amt: 25000, ev: c.ev[1] ? c.ev[1].name : "" }];
  const inner = `<form class="formcard" id="rf" novalidate style="padding:16px">
    <h2>${esc(t("recvDetails"))}</h2>
    <div class="fields">
      <label class="f">${esc(t("fromLbl"))}<input id="rf-from" type="text" value="${esc(L(c.from))}"></label>
      <label class="f">${esc(t("claimNoLbl"))}<input id="rf-no" type="number" inputmode="numeric" min="1" step="1" value="${c.no}"></label>
      <label class="f">${esc(t("servedLbl"))}<input id="rf-served" type="date" value="${c.served}"></label>
      <label class="f">${esc(t("amtLbl"))}<input id="rf-amt" type="number" inputmode="numeric" min="0" step="1000" value="${c.amt}"></label>
    </div>
    <p class="meta" id="rf-due" style="margin:0"></p>
    <h2 style="margin-top:6px">${esc(t("dedH"))}</h2>
    <div id="dedBox" style="display:grid;gap:10px"></div>
    <div class="btns"><button type="button" class="btn ghost small" id="dedAdd">${esc(t("dedAdd"))}</button></div>
    <div class="calc" id="rf-calc"></div>
    <div class="btns"><button class="btn" type="submit">${esc(t("genResp"))}</button></div></form>`;
  modal(t("doc_resp"), inner, () => {
    const g = id => document.getElementById(id);
    const evOpts = sel => `<option value="">${esc(t("dedNone"))}</option>` + c.ev.map(e => `<option value="${esc(e.name)}" ${e.name===sel?"selected":""}>${esc(e.name)}</option>`).join("");
    const total = () => deds.reduce((x,d) => x + (+d.amt||0), 0);
    const showCalc = () => { const amt = Math.max(0, +g("rf-amt").value || 0), dd = Math.min(amt, total());
      g("rf-calc").innerHTML = `<span class="tot">${esc(t("admCalc",{a:money(amt-dd), c:money(amt), d:money(dd)}))}</span><span></span>`; };
    const drawDeds = () => {
      g("dedBox").innerHTML = deds.map((d,k) => `<div class="dedrow">
        <label class="f">${esc(t("dedReason"))}<input data-k="${k}" data-f="reason" type="text" value="${esc(d.reason)}" placeholder="${esc(t("reasonPh"))}"></label>
        <label class="f">${esc(t("dedAmt"))}<input data-k="${k}" data-f="amt" type="number" inputmode="numeric" min="0" step="1000" value="${d.amt}"></label>
        <label class="f">${esc(t("dedEv"))}<select data-k="${k}" data-f="ev">${evOpts(d.ev)}</select></label>
        <button type="button" class="xbtn" data-del="${k}" aria-label="Remove">✕</button></div>`).join("");
      g("dedBox").querySelectorAll("[data-f]").forEach(inp => inp.addEventListener("input", () => { const d = deds[+inp.dataset.k]; d[inp.dataset.f] = inp.dataset.f==="amt" ? Math.max(0, +inp.value||0) : inp.value; showCalc(); }));
      g("dedBox").querySelectorAll("[data-del]").forEach(b => b.onclick = () => { deds.splice(+b.dataset.del, 1); drawDeds(); });
      showCalc();
    };
    g("dedAdd").onclick = () => { deds.push({ reason:"", amt:0, ev:"" }); drawDeds(); };
    const showDue = () => { const sv = g("rf-served").value || c.served; g("rf-due").textContent = `${t("inDue")}: ${fmt(add(sv,rd(c.job)))}`; };
    g("rf-served").addEventListener("input", showDue); g("rf-amt").addEventListener("input", showCalc); showDue(); drawDeds();
    g("rf").addEventListener("submit", e => {
      e.preventDefault();
      const name = g("rf-from").value.trim();
      if (name && name !== L(c.from)) c.from = { zh:name, en:name };
      c.no = Math.max(1, +g("rf-no").value || c.no);
      if (/^\d{4}-\d{2}-\d{2}$/.test(g("rf-served").value)) c.served = g("rf-served").value;
      c.amt = Math.max(0, +g("rf-amt").value || 0);
      const kept = deds.filter(d => (+d.amt||0) > 0);
      const adm = Math.max(0, c.amt - Math.min(c.amt, kept.reduce((x,d)=>x+(+d.amt||0),0)));
      c.resp = { date: today(), admitted: adm, deds: kept, reason: kept.map(d=>d.reason).join("; ") };
      render(); docResp(i);
    });
  });
}
function docResp(i){
  const c = claimsIn[i], j = J(c.job), r = c.resp;
  const html = `<div class="paper">
    <h3>付款回應 PAYMENT RESPONSE</h3>
    <div class="c">根據《建造業付款保障條例》（第652章）作出<br>Made under the Construction Industry Security of Payment Ordinance (Cap. 652)</div>
    <table>
      ${ln("致","To",esc(c.from.zh+" / "+c.from.en))}
      ${ln("付款方","Payer",esc(COMPANY.zh+" / "+COMPANY.en))}
      ${ln("合約","Contract",esc(`${j.name.zh} / ${j.name.en}`))}
      ${ln("回應付款申索","In response to payment claim",`#${c.no}（${esc(c.served)}）`)}
      ${ln("回應日期","Date of response",esc(r.date))}
    </table>
    <table>
      <tr><td>${bi("申索金額","Amount claimed")}</td><td class="n">${money(c.amt)}</td></tr>
      <tr class="tot"><td>${bi("承認金額","Amount admitted")}</td><td class="n">${money(r.admitted)}</td></tr>
      <tr><td>${bi("爭議金額","Amount disputed")}</td><td class="n">${money(c.amt-r.admitted)}</td></tr>
    </table>
    <p>${bi(`承認金額計算方法：申索金額 ${money(c.amt)} 減爭議項目 ${money(c.amt-r.admitted)}（見下列理由）`,`How the admitted amount is calculated: amount claimed ${money(c.amt)} less disputed items ${money(c.amt-r.admitted)} (reasons below)`)}</p>
    ${c.amt-r.admitted>0 ? (r.deds && r.deds.length ? `<p style="margin-bottom:4px"><b>${bi("扣減項目及理由","Deductions and reasons")}</b></p>
    <table><tr><td><b>${bi("理由","Reason")}</b></td><td><b>${bi("證據","Evidence")}</b></td><td class="n"><b>${bi("金額","Amount")}</b></td></tr>
    ${r.deds.map(d => `<tr><td>${esc(d.reason||"—")}</td><td>${esc(d.ev||"—")}</td><td class="n">${money(d.amt)}</td></tr>`).join("")}</table>`
      : `<p><b>${bi("爭議理由","Reasons for disputing")}</b><br>${esc(r.reason||"—")}</p>`) : ""}
    <p>${bi(`承認金額將於 ${add(c.served,pd(c.job))} 或之前支付。`,`The admitted amount will be paid on or before ${add(c.served,pd(c.job))}.`)}</p>
    <p>${bi("簽署及公司蓋印","Signature and company chop")}：<span class="sig">______________________</span></p>
    <div class="warn">${esc(t("draftNote"))}</div></div>`;
  modal(t("doc_resp"), html, null, { file:`付款回應-申索第${c.no}號`, back:() => respForm(i) });
}

function docLetter(i){
  const r = retention[i], j = J(r.job), lim = addYears(r.due,6), pay = add(today(),14);
  const html = `<div class="paper">
    <h3>要求發還保留金 REQUEST FOR RELEASE OF RETENTION</h3>
    <div class="c">${esc(today())}</div>
    <table>
      ${ln("致","To",esc(j.builder.zh+" / "+j.builder.en))}
      ${ln("由","From",esc(COMPANY.zh+" / "+COMPANY.en))}
      ${ln("工程","Project",esc(`${j.name.zh} / ${j.name.en}`))}
      ${ln("總合約簽訂","Main contract signed",esc(j.mainDate))}
    </table>
    <p>敬啟者：<br>根據上述分判合約，貴公司扣起之保留金 <b>${money(r.amt)}</b> 已於 <b>${esc(r.due)}</b>（${esc(r.stage.zh)}）到期發還，惟本公司至今仍未收到有關款項。</p>
    <p>請貴公司於 <b>${esc(pay)}</b> 或之前支付上述款項。如對金額有任何爭議，請於同日前以書面列明理由。</p>
    <p class="lbl">Dear Sirs,<br>Under the above subcontract, retention of ${money(r.amt)} held by you fell due for release on ${esc(r.due)} (${esc(r.stage.en)}). We have not received it. Please pay this amount by ${esc(pay)}. If you dispute any part of it, please set out your reasons in writing by the same date.</p>
    <p>${bi("此致","Yours faithfully")}<br>${esc(COMPANY.zh)}<br>${bi("簽署及公司蓋印","Signature and company chop")}：<span class="sig">______________________</span></p>
    <div class="warn">${esc(S.lang==="zh" ? `內部提示（唔會寄出）：追討時限估計為 ${lim}（到期後 6 年，須律師確認）。` : `Internal note (not sent): estimated time limit ${lim} (6 years after due date; to be confirmed by a lawyer).`)}<br>${esc(t("draftNote"))}</div></div>`;
  modal(t("doc_letter"), html, null, { file:`要求發還保留金-${j.name.zh}` });
}

/* ---------- controls ---------- */
document.getElementById("langBtn").onclick = () => { S.lang = S.lang==="zh" ? "en" : "zh"; try{ localStorage.setItem("ontime-lang", S.lang); }catch(e){} render(); };
document.querySelectorAll("[data-shift]").forEach(b => b.onclick = () => { const n=+b.dataset.shift; S.shift = n===0 ? 0 : S.shift + n; render(); });

render();
})();
</script>
</body>
</html>
